<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2b33">
<title>GODJI ECO KART – แข่งรถรักษ์โลก</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 30% 20%,#fff6c9,#ffd1dc 40%,#b5e3ff 100%);font-family:'Mitr',Tahoma,sans-serif;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.console{display:flex;align-items:stretch;filter:drop-shadow(0 18px 30px #0004)}
.joy{width:120px;border-radius:60px 0 0 60px;background:linear-gradient(160deg,#36c5f0,#0aa0d8);padding:26px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;box-shadow:inset -6px 0 0 #0003}
.joy.r{border-radius:0 60px 60px 0;background:linear-gradient(200deg,#ff6b6b,#e6304a);box-shadow:inset 6px 0 0 #0003}
.screenWrap{background:#2b2b33;padding:14px;border-top:6px solid #3a3a45;border-bottom:6px solid #1c1c22;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:8px;width:min(960px,74vw);aspect-ratio:16/10;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:2px}
.pad b{background:#222;border-radius:6px;box-shadow:0 4px 0 #000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer}
.pad i{display:block}
.btn{width:58px;height:58px;border-radius:50%;background:#222;color:#fff;font:12px 'Press Start 2P';display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #000;cursor:pointer}
.btn.small{width:38px;height:38px;font-size:9px}
.pad b:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.lbl{font-size:11px;color:#fff;text-align:center;text-shadow:0 1px 0 #0005;line-height:1.35}
.ab{display:grid;grid-template-columns:58px 58px;gap:6px}
.ab .btn:first-child{margin-top:34px}
#touch{display:none}
/* ---------- name entry overlay ---------- */
#nameBox{display:none;position:fixed;inset:0;z-index:20;background:#000a;align-items:center;justify-content:center;touch-action:auto}
#nameBox.show{display:flex}
#nameBox form{background:#fff;border:6px solid #222;border-radius:26px;width:min(420px,92vw);overflow:hidden;box-shadow:0 12px 0 #0006;text-align:center}
#nameBox h2{margin:0;background:#ff4d5e;color:#ffe066;font:18px 'Press Start 2P',monospace;padding:18px 10px;text-shadow:3px 3px 0 #222}
#nameBox p{margin:14px 16px 6px;color:#444;font-size:16px}
#nameIn{font:600 24px 'Mitr',sans-serif;text-align:center;width:84%;padding:10px;border:4px solid #222;border-radius:14px;outline:none;
 user-select:text;-webkit-user-select:text;touch-action:auto}
#nameIn:focus{border-color:#2f8cff}
#nameBox .row{display:flex;gap:10px;justify-content:center;margin:16px 0 20px}
#nameBox button{font:600 18px 'Mitr',sans-serif;padding:10px 22px;border:4px solid #222;border-radius:14px;box-shadow:0 4px 0 #222;cursor:pointer}
#nameBox button:active{transform:translateY(3px);box-shadow:0 1px 0 #222}
#nameOk{background:#3cc85a;color:#fff}#nameCancel{background:#eee;color:#444}
#nameBox small{display:block;color:#999;font-size:12px;margin-top:-10px;margin-bottom:14px}
/* ---------- mobile ---------- */
body.mob{background:#1c1c22;align-items:flex-start}
body.mob .joy{display:none}
body.mob .console{filter:none;width:100vw;height:100dvh;flex-direction:column;align-items:center}
body.mob .screenWrap{padding:0;border:0;background:#1c1c22;width:100%}
body.mob canvas{border-radius:0;width:auto;aspect-ratio:auto}
body.mob #touch{display:block;position:fixed;inset:0;pointer-events:none;z-index:5}
.tb{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
 color:#fff;font:600 22px 'Press Start 2P',monospace;background:#222c;border:3px solid #fff8;box-shadow:0 5px 0 #0008;touch-action:none}
.tb.on{transform:translateY(4px) scale(.94);box-shadow:0 1px 0 #0008;background:#ff4d5ecc}
.tb.sm{font:14px sans-serif;width:44px;height:44px}
.tb .s{position:absolute;bottom:-18px;font:11px 'Mitr',sans-serif;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
#tL,#tR{width:84px;height:84px}#tA{width:88px;height:88px;background:#e6304acc}#tB{width:70px;height:70px;background:#2f8cffcc}
#tA.on{background:#ff8a9a}#tB.on{background:#7bb8ff}#tL.on,#tR.on{background:#36c5f0cc}
body.land #tL{left:calc(14px + env(safe-area-inset-left));bottom:22px}
body.land #tR{left:calc(112px + env(safe-area-inset-left));bottom:22px}
body.land #tA{right:calc(16px + env(safe-area-inset-right));bottom:56px}
body.land #tB{right:calc(116px + env(safe-area-inset-right));bottom:18px}
body.land #tS{right:calc(16px + env(safe-area-inset-right));top:12px}
body.land #tMute{right:calc(68px + env(safe-area-inset-right));top:12px}
body.land #tTilt{right:calc(120px + env(safe-area-inset-right));top:12px}
body.land #tFull{right:calc(172px + env(safe-area-inset-right));top:12px}
body.port #tL{left:18px;bottom:calc(70px + env(safe-area-inset-bottom))}
body.port #tR{left:116px;bottom:calc(70px + env(safe-area-inset-bottom))}
body.port #tA{right:18px;bottom:calc(96px + env(safe-area-inset-bottom))}
body.port #tB{right:118px;bottom:calc(52px + env(safe-area-inset-bottom))}
body.port .tb.sm{bottom:calc(10px + env(safe-area-inset-bottom))}
body.port #tFull{left:18px}body.port #tTilt{left:70px}body.port #tMute{right:70px}body.port #tS{right:18px}
#hint{display:none;position:absolute;left:0;right:0;text-align:center;color:#fff;font-size:14px;opacity:.85;pointer-events:none}
body.port #hint{display:block}
#tiltTip{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#222e;color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;display:none;z-index:9;pointer-events:none}
@media(max-width:760px){.joy{width:86px;padding:16px 4px}}
</style></head><body>
<div class="console" id="console">
 <div class="joy">
  <div class="btn small" id="mute">♪</div>
  <div class="pad"><i></i><b id="U">▲</b><i></i><b id="L">◀</b><i></i><b id="R">▶</b><i></i><b id="D">▼</b><i></i></div>
  <div class="lbl">◀ ▶ เลี้ยว/เลือก<br>▼ เบรก</div>
 </div>
 <div class="screenWrap" id="wrap"><canvas id="c"></canvas></div>
 <div class="joy r">
  <div class="btn small" id="S">+</div>
  <div class="ab"><div class="btn" id="B">B</div><div class="btn" id="A">A</div></div>
  <div class="lbl">A / SPACE<br>ยืนยัน / ไอเทม<br>B ย้อนกลับ</div>
 </div>
</div>
<div id="touch">
 <div id="hint">💡 หมุนโทรศัพท์เป็นแนวนอนเพื่อจอใหญ่ขึ้น</div>
 <div class="tb" id="tL">◀</div><div class="tb" id="tR">▶</div>
 <div class="tb" id="tB">B<span class="s">เบรก/กลับ</span></div><div class="tb" id="tA">A<span class="s">ไอเทม/ตกลง</span></div>
 <div class="tb sm" id="tFull">⛶</div><div class="tb sm" id="tTilt">📱</div><div class="tb sm" id="tMute">♪</div><div class="tb sm" id="tS">+</div>
</div>
<div id="tiltTip"></div>
<!-- name entry -->
<div id="nameBox"><form id="nameForm" autocomplete="off">
 <h2>ENTER NAME</h2>
 <p>ใส่ชื่อนักแข่งของคุณ</p>
 <input id="nameIn" maxlength="12" placeholder="ชื่อของคุณ" enterkeyhint="done">
 <div class="row"><button type="button" id="nameCancel">ยกเลิก</button><button type="submit" id="nameOk">ตกลง ✔</button></div>
 <small>สูงสุด 12 ตัวอักษร • ชื่อจะแสดงบน Scoreboard</small>
</form></div>
<script>
window.onerror=(m,u,l)=>{document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;padding:8px;z-index:99">Error: '+m+' (line '+l+')</div>')};
// ================= DEVICE / LAYOUT =================
const MOB=matchMedia('(hover:none) and (pointer:coarse)').matches;
const $=id=>document.getElementById(id);
if(MOB)document.body.classList.add('mob');
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=640,H=400;
const RS=MOB?Math.min(2,Math.max(1.5,window.devicePixelRatio||1)):Math.min(3,Math.max(2,(window.devicePixelRatio||1)*1.5));
cv.width=W*RS;cv.height=H*RS;x.imageSmoothingQuality='high';
function layout(){
 if(!MOB)return;
 const vw=innerWidth,vh=innerHeight,land=vw>vh;
 document.body.classList.toggle('land',land);document.body.classList.toggle('port',!land);
 let w,h;if(land){h=vh;w=Math.min(vw,vh*1.6)}else{w=vw;h=w/1.6}
 cv.style.width=w+'px';cv.style.height=h+'px';
 document.getElementById('hint').style.top=(h+14)+'px';
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));layout();

const PX="'Press Start 2P',monospace",TH="'Mitr',Tahoma,sans-serif";
const SEG=200,RUMBLE=3,ROADW=2000,LANES=3,FOV=100,CAMH=1000,DRAW=MOB?220:300;
const CAMD=1/Math.tan(FOV/2*Math.PI/180),PLAYERZ=CAMH*CAMD;
const MAXS=SEG*60,ACCEL=MAXS/5,BRAKE=-MAXS,DECEL=-MAXS/5,OFFDEC=-MAXS/2,OFFLIM=MAXS/4,CENTRI=0.3,LAPS=3;
const COL={light:{road:'#8d8d95',grass:'#72d66b',rumble:'#ff4d5e',lane:'#fff'},
 dark:{road:'#85858d',grass:'#5fc65a',rumble:'#fff',lane:null},
 s1:{road:'#fff',grass:'#72d66b',rumble:'#ff4d5e',lane:null},s2:{road:'#222',grass:'#5fc65a',rumble:'#fff',lane:null}};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

// ================= PLAYER NAME & SCOREBOARD =================
const BOARD_KEY='ecoKartBoard',NAME_KEY='ecoKartName',BOARD_MAX=10;
let playerName=localStorage.getItem(NAME_KEY)||'';
let board=[];try{board=JSON.parse(localStorage.getItem(BOARD_KEY)||'[]')}catch(e){board=[]}
let newIdx=-1,boardPos=0;
const hiScore=()=>board.length?board[0].score:0;
function saveEntry(e){
 e.id=Date.now()+'_'+Math.random();board.push(e);
 board.sort((a,b)=>b.score-a.score||a.time-b.time);
 const all=board.findIndex(b=>b.id===e.id);boardPos=all+1;
 board=board.slice(0,BOARD_MAX);newIdx=board.findIndex(b=>b.id===e.id);
 localStorage.setItem(BOARD_KEY,JSON.stringify(board))}
function clearBoard(){if(confirm('ล้าง Scoreboard ทั้งหมดในเครื่องนี้?')){board=[];newIdx=-1;localStorage.setItem(BOARD_KEY,'[]')}}
const nameBox=document.getElementById('nameBox'),nameIn=document.getElementById('nameIn');
let nameNext='title';
function openName(next){nameNext=next;st='name';engine(false);nameIn.value=playerName;nameBox.classList.add('show');
 setTimeout(()=>{nameIn.focus();nameIn.select()},50)}
function closeName(ok){
 if(ok){const v=nameIn.value.replace(/\s+/g,' ').trim().slice(0,12);playerName=v||'PLAYER';localStorage.setItem(NAME_KEY,playerName);sfx.ok()}
 nameBox.classList.remove('show');nameIn.blur();
 st=ok?nameNext:'title';if(st==='selChar')selI=charI;setTimeout(layout,300)}
document.getElementById('nameForm').addEventListener('submit',e=>{e.preventDefault();closeName(true)});
document.getElementById('nameCancel').addEventListener('click',()=>closeName(false));

function kart(cx,by,s,col,steer,drv,name,style,rb=false){
 const rear=(st==='race'||st==='count'||st==='finish')&&GR[drv];
 const im=rear?GR[drv]:GI[drv];
 x.save();x.translate(cx,by);x.scale(s,s);
 const sh=x.createRadialGradient(0,-4,10,0,-4,110);sh.addColorStop(0,'rgba(0,0,0,.45)');sh.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=sh;x.beginPath();x.ellipse(0,-4,110,20,0,0,7);x.fill();
 if(im&&im.complete&&im.naturalWidth){
  if(rear){
   const h=205,w=h*im.naturalWidth/im.naturalHeight,bob=Math.sin(t*22+cx*.1)*1.4;
   x.rotate(steer*.05);x.transform(1,0,-steer*.06,1,0,0);
   if(rb)x.filter=`hue-rotate(${(t*720)%360}deg) saturate(1.6) brightness(1.15)`;
   x.drawImage(im,-w/2,-h+6+bob,w,h);x.filter='none';
   if(Math.abs(steer)>.5&&s>.6){x.globalAlpha=.5;for(let k=0;k<4;k++){const px=(steer>0?-1:1)*(70+Math.random()*30),py=-10-Math.random()*25;circ(px,py,8+Math.random()*10,'#ddd',false)}x.globalAlpha=1}
  }else{
   const h=230,w=h*im.naturalWidth/im.naturalHeight,bob=Math.sin(t*18+cx)*1.2;
   x.rotate(steer*.05);if(steer>.35)x.scale(-1,1);
   if(rb)x.filter=`hue-rotate(${(t*720)%360}deg) saturate(1.6)`;
   x.drawImage(im,-w/2,-h+8+bob,w,h);x.filter='none';
  }
 }else{rr(-70,-60,140,60,14,col,'#222',4)}
 x.restore();
 if(name&&s>.3)txt(name,cx,by-s*230,Math.max(7,10*s),'#fff',PX,'#222',4);
}

function render(){
 x.save();if(shake>.5)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 background();
 const base=findSeg(pos),bp=(pos%SEG)/SEG,ps=findSeg(pos+PLAYERZ),pp=((pos+PLAYERZ)%SEG)/SEG,py=lerp(ps.p1.world.y,ps.p2.world.y,pp);
 let maxy=H,xx=0,dx=-(base.curve*bp);
 for(let n=0;n<DRAW;n++){const s=segs[(base.index+n)%segs.length],loop=s.index<base.index,cz=pos-(loop?L:0);
  project(s.p1,px*ROADW-xx,py+CAMH,cz);project(s.p2,px*ROADW-xx-dx,py+CAMH,cz);xx+=dx;dx+=s.curve;s.clip=maxy;
  if(s.p1.camera.z<=CAMD||s.p2.screen.y>=s.p1.screen.y||s.p2.screen.y>=maxy)continue;
  const fog=Math.pow(n/DRAW,3)*.45;
  drawSeg(s.p1.screen.x,s.p1.screen.y,s.p1.screen.w,s.p2.screen.x,s.p2.screen.y,s.p2.screen.w,fog,s.color);maxy=s.p1.screen.y}
 for(let n=DRAW-1;n>0;n--){const s=segs[(base.index+n)%segs.length];if(s.p1.camera.z<=CAMD)continue;
  for(const sp of s.sprites){const sc=s.p1.screen.scale;drawSprite(sp,s.p1.screen.x+sc*sp.offset*ROADW*W/2,s.p1.screen.y,sc,s.clip)}
  for(const c of s.cars){const p=(c.z%SEG)/SEG,sc=lerp(s.p1.screen.scale,s.p2.screen.scale,p);
   const X=lerp(s.p1.screen.x,s.p2.screen.x,p)+sc*c.offset*ROADW*W/2,Y=lerp(s.p1.screen.y,s.p2.screen.y,p),k=sc*520*W/2/160;
   if(k>.03&&k<3){x.save();x.beginPath();x.rect(0,0,W,s.clip);x.clip();kart(X,Y,k,c.c,0,c.drv,c.n,c.style);x.restore()}}}
 const bounce=(Math.abs(px)>1&&speed>0?Math.random()*4:0)+Math.sin(t*20)*speed/MAXS*1.2;
 if(boostT>0||starT>0){const ac=CHARS[charI].pc;x.save();x.globalAlpha=.4+.15*Math.sin(t*30);const g=x.createRadialGradient(W/2,H-100,10,W/2,H-100,170);g.addColorStop(0,'#fff');g.addColorStop(.4,ac);g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.ellipse(W/2,H-100,160,130,0,0,7);x.fill();x.globalAlpha=.8;for(let k=0;k<16;k++){const sx=W/2+(Math.random()-.5)*170,sy=H-20-Math.random()*30;x.fillStyle=['#ffe066','#ff9a1f','#fff'][k%3];x.fillRect(sx,sy,3,3)}x.restore()}
 {const vg=x.createRadialGradient(W/2,H*.55,H*.35,W/2,H*.55,W*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,20,40,.38)');x.fillStyle=vg;x.fillRect(0,0,W,H)}
 const K=KARTS[kartI];kart(W/2,H-6-bounce,.95,K.c,steer,CHARS[charI].id,null,K.id,starT>0);
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.t-=1/60;x.globalAlpha=Math.max(0,Math.min(1,p.t*2));
  if(p.star)star(p.x,p.y,p.r+2,p.c);else{x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}}x.globalAlpha=1;parts=parts.filter(p=>p.t>0);
 if(boostT>0){x.strokeStyle='#ffffffaa';x.lineWidth=2;for(let i=0;i<10;i++){const a=Math.random()*6.28,r=150+Math.random()*120;x.beginPath();x.moveTo(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r*.6);x.lineTo(W/2+Math.cos(a)*(r+60),H/2+Math.sin(a)*(r+60)*.6);x.stroke()}}
 x.restore();hud();
}
